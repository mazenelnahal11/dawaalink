version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dawaalink-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawaalink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dawaalink}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dawaalink_user} -d ${POSTGRES_DB:-dawaalink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dawaalink-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dawaalink}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dawaalink_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dawaalink-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
